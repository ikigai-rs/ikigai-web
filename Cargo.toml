[package]
# RENAMED from `ikigai-web` 2026-08-16, and the contest it was parked on is over:
# ikigai-cli's `crates/ikigai-web` — the workspace's inbound-HTTP transport
# library — published first and owns that name on crates.io (0.1.13). Two crates
# cannot share it, so this one, the standalone SERVER, took a distinct name
# rather than leaving a repo permanently unpublishable.
#
# The BINARY is deliberately still `ikigai-web` (see [[bin]]): every operational
# reference on a machine names the binary, not the crate — the launchd plist's
# ProgramArguments, its /tmp/ikigai-web.log paths, the installed ~/.cargo/bin
# entry. Renaming the package alone kept the running daemon, the supervision and
# the re-registration untouched.
name = "ikigai-web-server"
version = "0.3.1"
edition = "2021"
description = "Browse an ikigai kernel from a web browser: an HTTP face over a kernel composed from the machine's normal config-home mounts. Loopback by default (GET→Source, HEAD→Exists, one POST route: annotation minting); a non-loopback bind (web.bind/--bind) serves read-only — the write surface is disabled, not gated. Accept↔conneg; typed errors→status codes. Plus /sparql: a read-only, content-negotiated SPARQL face with a same-origin editor page."
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-web"

[dependencies]
# The kernel this face fronts: Request/Verb/Representation/Error + the space
# combinators (Fallback) the mount composition uses.
ikigai-core = "0.1.54"
# RemoteSpace/MountedRemote — the Resolver→Space adapters that let this process
# compose the machine's peers (the dev server) behind IRI prefixes.
ikigai-resolve = "0.1.10"
# The IPC client transport: dial a Unix-socket peer (wire-v6 hello). 0.1.13 is
# the true minimum: below it a resolver never redials, so a peer restart leaves
# this process's mounted namespace dead until the process itself restarts.
ikigai-ipc = "0.1.13"
# The accept loop + per-connection tasks. Multi-thread because the forwarding
# endpoints round-trip the wire SYNCHRONOUSLY (ikigai-resolve 0.1.10), each
# in-flight request parks a worker thread.
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }

[[bin]]
name = "ikigai-web"
path = "src/main.rs"
